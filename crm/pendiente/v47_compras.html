<style id="hz-v47-compras-css">
#hz-fin-hist .hz47-ciclo{margin:8px 0 10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:13px;line-height:1.5}
#hz-fin-hist .hz47-ciclo b{font-variant-numeric:tabular-nums}
#hz-fin-hist .hz47-est{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;margin-left:6px;background:var(--sunk);color:var(--muted)}
#hz-fin-hist .hz47-est.toca{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
#hz-fin-hist .hz47-est.atrasado{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
#hz-fin-hist .hz47-prod{margin-top:6px;font-size:12.5px}
#hz-fin-hist .hz47-nota{margin-top:6px;font-size:11.5px;color:var(--muted)}
</style>
<script id="hz-v47-compras">
/* v47 (23/11/2026) · «Historial de compras» pasa a «Compras» y muestra el ciclo de recompra arriba de los pedidos.
   El ciclo sale de las compras limpias (colección comprasLimpias + config/limpia, las arma importar.py de Loki): cantidades netas
   de notas de crédito, sin anticipos ni diferencias de cambio, sin precios. Sin documento limpio para el CUIT, el motor usa la
   facturación como antes. Solo cambia lo que lee el motor de recompra; la lista de pedidos sigue igual. */
(function(){
 if(window.hzV47c)return;window.hzV47c=true;
 const dig=x=>String(x||'').replace(/\D/g,'');
 const E=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const fmtF=f=>f?f.slice(8,10)+'/'+f.slice(5,7)+'/'+f.slice(0,4):'';
 let limpia={},cfg=null,anul=new Set(),dentro=0;
 window.hzLimpia={docs:()=>limpia,cfg:()=>cfg};
 /* 1. el motor de recompra lee las compras limpias */
 const fl=window.hzFactLinesFor;
 window.hzFactLinesFor=function(o){
  if(dentro&&o){const id=o.facturacionId||dig(o.cuit),d=id&&limpia[id];if(d&&Array.isArray(d.lineas))return d.lineas.map(l=>({...l,tipo:'F'}));}
  return typeof fl==='function'?fl.apply(this,arguments):[];
 };
 const fo=window.hzFinOrdersFor;
 window.hzFinOrdersFor=function(){const r=typeof fo==='function'?fo.apply(this,arguments):[];return dentro&&anul.size?r.filter(p=>!anul.has(String(p.numero||''))):r};
 const bp=hzBuyPattern;
 hzBuyPattern=function(){dentro++;try{return bp.apply(this,arguments)}finally{dentro--}};
 /* 2. bloque Compras de la ficha */
 const EST={toca:'le toca',atrasado:'atrasado',en_ciclo:'en ciclo',inactivo:'inactivo',dormido:'sin compras hace más de un año',sin_patron:'sin ciclo claro'};
 const estTxt=p=>p.status==='toca'?(p.days>=0?'le toca en '+p.days+' días':'le toca · '+(-p.days)+' días pasado'):p.status==='atrasado'?'atrasado '+(-p.days)+' días':p.status==='en_ciclo'&&p.days!=null?'próxima en '+p.days+' días':(EST[p.status]||p.status);
 function cicloHTML(o){
  const p=o&&hzBuyPattern(o);if(!p)return '<div class="hz47-ciclo">Sin compras registradas para calcular el ciclo.</div>';
  const corte=cfg&&cfg.corte;
  const prods=(p.items||[]).filter(x=>x.compras>0).slice(0,3).map(x=>'<div>'+E(x.nombre)+(x.qty>0?' · '+x.qty.toLocaleString('es-AR')+' u.':'')+' · '+x.compras+' compra'+(x.compras===1?'':'s')+(x.cycle?' · cada '+x.cycle+' días':'')+' · '+E(estTxt(x))+'</div>').join('');
  return '<div class="hz47-ciclo"><div>'+(p.cycle?'Compra cada <b>'+p.cycle+' días</b>':'Sin ciclo medible')+' · última <b>'+E(fmtF(p.last))+'</b>'+(p.next?' · próxima <b>'+E(fmtF(p.next))+'</b>':'')
   +'<span class="hz47-est '+E(p.status)+'">'+E(estTxt(p))+'</span></div>'
   +(prods?'<div class="hz47-prod">'+prods+'</div>':'')
   +'<div class="hz47-nota">'+(corte?'Datos de Finnegans al '+E(fmtF(corte))+' · notas de crédito descontadas, sin anticipos':'Facturación sin limpiar: falta la carga de compras limpias')+'</div></div>';
 }
 function pintar(){
  const panel=document.getElementById('hz-fin-hist');if(!panel||typeof st==='undefined'||!st.cur)return;
  const d=panel.querySelector('details.hz-fin-hist');if(!d)return;
  const s=d.querySelector('summary');if(s&&!s.dataset.hz47){s.dataset.hz47='1';s.textContent=s.textContent.replace(/^\s*Historial de compras/,'Compras')}
  const html=cicloHTML(st.cur),old=d.querySelector('.hz47-ciclo');
  if(old){if(old.outerHTML!==html)old.outerHTML=html}else if(s)s.insertAdjacentHTML('afterend',html);
 }
 let obs=null;
 function vigilar(){const panel=document.getElementById('hz-fin-hist');if(!panel||obs)return;obs=new MutationObserver(()=>{if(!panel.querySelector('.hz47-ciclo')||!panel.querySelector('summary[data-hz47]'))try{pintar()}catch(e){console.warn('[v47] compras',e)}});obs.observe(panel,{childList:true,subtree:false})}
 if(typeof openSheet==='function'){const os=openSheet;openSheet=function(){const r=os.apply(this,arguments);setTimeout(()=>{try{vigilar();pintar()}catch(e){console.warn('[v47] compras',e)}},0);return r}}
 /* 3. datos */
 function bump(){window.hzFactVer=(window.hzFactVer||0)+1;try{if(typeof hzPatCache!=='undefined')hzPatCache.clear()}catch(_){}try{hzEngCache=null}catch(_){}try{if(typeof st!=='undefined'&&st.loaded)render()}catch(_){}try{pintar()}catch(_){}}
 (async()=>{const db=await window.claude?.use?.('db');if(!db)return;
  db.collection('comprasLimpias').onSnapshot(snap=>{const d={};snap.docs.forEach(x=>{d[x.id]=x.data()||{}});limpia=d;bump()},()=>{});
  db.collection('config').doc('limpia').onSnapshot(sn=>{const d=sn&&sn.exists===false?null:sn&&sn.data&&sn.data();cfg=d||null;anul=new Set((d&&d.pedidosAnulados)||[]);bump()},()=>{});
 })();
})();
</script>
