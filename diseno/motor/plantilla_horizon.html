<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>PM FiberHome</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: barra negra fina con filete de colores de fibra (TIA-598); en escritorio, pedido fijo a la izquierda y dictamen a la derecha; cada capa de red lleva su color de fibra. */
:root{
  --bg:#f3f4f6; --panel:#ffffff; --sunk:#f3f4f6; --ink:#101216; --muted:#5c626c; --faint:#8a9099; --line:#dde0e5;
  --ban:#0b0c0e; --ban-ink:#ffffff; --ban-muted:#9ea3ac;
  --good:#1d7f47; --good-bg:#e2f3e8; --warn:#9a5b00; --warn-bg:#fbeedb; --bad:#b92d2d; --bad-bg:#fbe5e5; --info-bg:#f3f4f6; --info:#101216; --acc:#00873e; --acc-2:#009e49;
  --f1:#1f5fbf; --f2:#e07a12; --f3:#2e9b4f; --f4:#8a5a3b; --f5:#8a8f98; --f6:#d9d9d4; --f7:#cc3434; --f8:#1c1c1c;
  --fib:linear-gradient(90deg,#1f5fbf 0 8.33%,#e07a12 0 16.66%,#2e9b4f 0 25%,#8a5a3b 0 33.33%,#8a8f98 0 41.66%,#ececea 0 50%,#cc3434 0 58.33%,#3a3a3a 0 66.66%,#e8c21e 0 75%,#7d4fc4 0 83.33%,#e46fa6 0 91.66%,#3fb8c9 0 100%);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:2px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d0f12; --panel:#15181d; --sunk:#0d0f12; --ink:#eceef1; --muted:#9aa0aa; --faint:#6f7680; --line:#2a2f37;
  --good:#5cc786; --good-bg:#15301f; --warn:#f0b04a; --warn-bg:#36280f; --bad:#ff7a7a; --bad-bg:#3a1a1a; --info-bg:#1c2026; --info:#eceef1; --acc:#16a856; --acc-2:#22c065;
  --f8:#bfbfbf; --f6:#e8e8e4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d0f12; --panel:#15181d; --sunk:#0d0f12; --ink:#eceef1; --muted:#9aa0aa; --faint:#6f7680; --line:#2a2f37;
  --good:#5cc786; --good-bg:#15301f; --warn:#f0b04a; --warn-bg:#36280f; --bad:#ff7a7a; --bad-bg:#3a1a1a; --info-bg:#1c2026; --info:#eceef1; --acc:#16a856; --acc-2:#22c065;
  --f8:#bfbfbf; --f6:#e8e8e4; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
/* Barra */
.bar{background:var(--ban);color:var(--ban-ink);position:relative}
.bar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--fib)}
.bar .in{max-width:1320px;margin:0 auto;padding-block:12px 16px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.bar img{height:24px;width:auto;display:block}
.bar h1{font-size:16px;font-weight:600;letter-spacing:.01em}
.bar .sub{color:var(--ban-muted);font-size:12.5px}
.bar nav{margin-left:auto;display:flex;gap:2px;flex-wrap:wrap}
.bar nav button{border:0;background:none;color:var(--ban-muted);padding:6px 12px;border-radius:2px;font-weight:500;font-size:13.5px}
.bar nav button:hover{color:var(--ban-ink)}
.bar nav button[aria-selected="true"]{background:#24262b;color:var(--ban-ink)}
.wrap{max-width:1320px;margin:0 auto;padding-block:20px 56px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.notice{padding:10px 14px;border-radius:var(--r);background:var(--sunk);font-size:13px;margin-bottom:16px}
/* Consultar: dos columnas */
.grid{display:grid;grid-template-columns:380px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.ask{position:sticky;top:16px;background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:18px;display:flex;flex-direction:column;gap:14px}
@media (max-width:900px){.ask{position:static}}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--sunk);padding:4px;border-radius:2px}
.modes button{border:0;background:none;border-radius:2px;padding:8px 6px;font-size:12.5px;font-weight:600;color:var(--muted);line-height:1.25}
.modes button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:600}
input,textarea,select{border:1px solid var(--line);background:var(--panel);border-radius:2px;padding:9px 11px;font-size:14px;width:100%;color:var(--ink)}
textarea{resize:vertical;min-height:120px;line-height:1.5}
.ex{display:flex;flex-direction:column;gap:4px}
.ex button{border:0;background:none;text-align:left;padding:3px 0;font-size:12.5px;color:var(--info)}
.ex button:hover{text-decoration:underline}
.sw{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:2px;background:var(--sunk);font-size:13px;cursor:pointer}
.sw input{width:auto;margin-top:3px}
.sw small{display:block;color:var(--muted);font-size:12px}
.go{border:0;background:var(--ban);color:var(--ban-ink);border-radius:2px;padding:12px 16px;font-weight:600;font-size:15px}
.go:disabled{opacity:.45;cursor:not-allowed}
.err{color:var(--bad);font-size:13px;font-weight:600;margin:0}
.hint{color:var(--muted);font-size:12.5px;margin:0}
/* Dictamen */
.out{display:flex;flex-direction:column;gap:18px;min-width:0}
.idle{border:1px dashed var(--line);border-radius:2px;padding:28px;color:var(--muted);display:flex;flex-direction:column;gap:12px}
.idle h2{font-size:18px;color:var(--ink);font-weight:600}
.idle ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.thinking{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:13.5px;padding:14px 0}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--info);animation:pu 1s infinite alternate}
@keyframes pu{to{opacity:.2}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.verdict{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:20px 22px;display:flex;flex-direction:column;gap:8px}
.verdict .c{font-size:19px;line-height:1.45;font-weight:500;max-width:68ch}
.sec{display:flex;flex-direction:column;gap:10px}
.sec>h3{font-size:13px;font-weight:600;display:flex;gap:10px;align-items:baseline}
.sec>h3 .lbl{font-weight:400}
.bom{background:var(--panel);border:1px solid var(--line);border-radius:2px;overflow:hidden}
.cap{display:grid;grid-template-columns:150px minmax(0,1fr);border-top:1px solid var(--line)}
.cap:first-child{border-top:0}
@media (max-width:620px){.cap{grid-template-columns:minmax(0,1fr)}}
.cap .cn{padding:12px 14px;display:flex;gap:8px;align-items:flex-start;font-size:12.5px;font-weight:600;background:var(--sunk)}
.fd{flex:none;width:10px;height:10px;border-radius:50%;margin-top:4px;box-shadow:0 0 0 1px rgba(0,0,0,.18)}
.cap .items{display:flex;flex-direction:column}
.it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 16px;border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.it .nm{font-weight:600;font-size:14.5px}
.it .why{grid-column:1;font-size:13px;color:var(--muted);margin:0}
.it .ks{grid-column:1;display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--mono);font-size:11.5px;color:var(--ink)}
.it .ks span b{font-weight:400;color:var(--faint)}
.it .side{grid-column:2;grid-row:1/4;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.fit{font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.fit.exacto{background:var(--good-bg);color:var(--good)}.fit.alternativa{background:var(--warn-bg);color:var(--warn)}.fit.no{background:var(--bad-bg);color:var(--bad)}
.ico{display:flex;gap:6px}
.ib{border:1px solid var(--line);background:var(--panel);border-radius:2px;padding:3px 9px;font-size:12px;font-weight:600;color:var(--ink);text-decoration:none}
.ib:hover{border-color:var(--ink)}
.ib.pdf{color:var(--bad)}
.alert{display:flex;gap:12px;padding:12px 16px;border-radius:2px;background:var(--warn-bg);font-size:13.5px}
.alert b{color:var(--warn);white-space:nowrap}
.alert ul{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:3px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:1100px){.two{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{font-size:14px;font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:center}
.card ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:13.5px}
.card .sub{font-size:12px;font-weight:600;color:var(--muted);margin-top:2px}
.card.ask2{border-color:var(--info);box-shadow:inset 3px 0 0 var(--info)}
.card.ask2 h3{color:var(--info)}
.copy{border:1px solid var(--line);background:var(--panel);border-radius:2px;padding:4px 10px;font-size:12px;font-weight:600}
.copy:hover{border-color:var(--ink)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.score{display:flex;align-items:baseline;gap:8px}
.score b{font-size:30px;font-weight:600;font-family:var(--mono)}
.learn{display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:14px 18px;border-radius:2px;background:var(--ban);color:var(--ban-ink)}
.learn p{margin:0;max-width:70ch;font-size:14px}
.learn .lbl{color:var(--ban-muted)}
.learn .copy{background:transparent;color:var(--ban-ink);border-color:#3a3d44}
.tbl{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:2px}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13.5px}
tr:last-child td{border-bottom:0}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:400}
td small{display:block;color:var(--muted);font-size:12px}
tr.click{cursor:pointer}tr.click:hover td{background:var(--sunk)}
td.n{font-family:var(--mono);color:var(--muted)}
.linkb{border:0;background:none;padding:0;color:var(--info);font-weight:600;text-align:left}
.linkb:hover{text-decoration:underline}
.calc{margin:0;padding-left:20px;font-family:var(--mono);font-size:12.5px;display:flex;flex-direction:column;gap:3px}
/* Vistas secundarias */
.vh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.vh h2{font-size:20px;font-weight:600}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters input{max-width:320px}.filters select{width:auto;min-width:160px}
.est{font-size:11.5px;font-weight:600;white-space:nowrap}
.est.completo{color:var(--good)}.est.parcial{color:var(--warn)}.est.falta{color:var(--bad)}
.pdftag{font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:4px;background:var(--bad);color:#fff;margin-left:6px}
.drop{border:1.5px dashed var(--line);border-radius:2px;padding:22px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;background:var(--panel);margin-bottom:14px}
.drop.over{border-color:var(--info);background:var(--info-bg)}
.pbar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}.pbar i{display:block;height:100%;background:var(--good);transition:width .3s}
.sumrow{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;margin:8px 0}
.sumrow b{font-family:var(--mono)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:2px;padding:8px 14px;font-weight:600}
.btn:hover{border-color:var(--ink)}.btn.dark{background:var(--ban);border-color:var(--ban);color:var(--ban-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.tool{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.tool h3{font-size:15px;font-weight:600}.tool p{margin:0;color:var(--muted);font-size:13px}
.frow{display:grid;grid-template-columns:120px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:13px}
.frow label{font-weight:500}
.frow output{font-family:var(--mono);text-align:right}
.res{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.res div{background:var(--sunk);border-radius:2px;padding:10px 12px;min-width:0}
.res span{display:block;font-size:11.5px;color:var(--muted)}.res b{font-size:17px;font-family:var(--mono);font-weight:500}
.vd{padding:10px 12px;border-radius:2px;font-weight:600;font-size:13.5px}
.vd.ok{background:var(--good-bg);color:var(--good)}.vd.warn{background:var(--warn-bg);color:var(--warn)}.vd.bad{background:var(--bad-bg);color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:4px 11px;font-size:12.5px;font-weight:500}
.chip:hover{border-color:var(--ink)}
.empty{color:var(--muted);font-size:13.5px}
/* Ficha */
.scrim{position:fixed;inset:0;background:rgba(5,8,14,.5);z-index:10}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--panel);z-index:11;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) 22px;box-shadow:-10px 0 40px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:14px}
.sheet>header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.sheet h2{font-size:20px;font-weight:600}
.x{border:0;background:var(--sunk);border-radius:2px;width:34px;height:34px;font-size:18px;flex:none}
.spec{border:1px solid var(--line);border-radius:2px;overflow:hidden}
.spec table{min-width:0}.spec td{padding:7px 12px;font-size:13px}.spec td.k{color:var(--muted);width:38%}
.pdfs{display:flex;flex-direction:column;gap:8px}
.pdf{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:2px;color:var(--ink);text-decoration:none}
.pdf:hover{border-color:var(--ink)}
.pdf .pi{flex:none;display:grid;place-items:center;width:34px;height:42px;border-radius:2px;background:var(--bad);color:#fff;font-family:var(--mono);font-size:10.5px}
.pdf b{display:block;font-size:13.5px;font-weight:600}.pdf small{display:block;color:var(--muted);font-size:12px}
.blk{display:flex;flex-direction:column;gap:6px}
.blk ul{margin:0;padding-left:18px;font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:2px;font-weight:600;z-index:20}
@media (prefers-reduced-motion:no-preference){.sheet{animation:sl .18s ease-out}@keyframes sl{from{transform:translateX(30px);opacity:.6}}}

[hidden]{display:none!important}
/* Diseño */
.dzsep{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;margin-top:2px}
.dz2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.dzimg{display:flex;gap:12px;align-items:center}
.dzimg b{font-size:12.5px;font-weight:600}
.dzthumb{position:relative;width:64px;height:64px;flex:none;border:1px solid var(--line);background:#1d1a31;display:grid;place-items:center;overflow:hidden}
.dzthumb img{max-width:100%;max-height:100%;object-fit:contain}
.dzthumb span{font-size:10.5px;color:#8a85aa;text-align:center;padding:4px}
.dzthumb .x{position:absolute;top:2px;right:2px;width:22px;height:22px;font-size:14px;line-height:1}
.dzrevs{display:flex;gap:8px;flex-wrap:wrap}
.dzrevs .dzthumb{width:84px;height:104px}
.dzdrop{margin-bottom:0}
.dzfoot summary{cursor:pointer;font-size:12.5px;font-weight:600;padding:4px 0}
.dzfoot[open]{display:flex;flex-direction:column;gap:10px}
.dzstage{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.dzframe{background:#0e0d16;padding:10px;max-width:100%}
.dzframe canvas{display:block;height:auto;max-width:100%}
.dzframe canvas{width:100%}
.dzpair{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media (max-width:640px){.dzpair{grid-template-columns:1fr}}
.dzfig{margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.dz-estado{max-width:300px}
.dzul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.dzerrs{display:flex;flex-direction:column;gap:8px}
.tag{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:2px;vertical-align:1px}
.tag.bad{background:var(--bad-bg);color:var(--bad)}.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.good{background:var(--good-bg);color:var(--good)}

:focus-visible{outline:2px solid var(--acc)}
/* Banner: negro liso, un solo corte diagonal */
.bar{background:#0b0c0e}
.bar::after{display:none}
.bar .in{padding-block:0;min-height:68px;gap:18px;align-items:stretch}
.bar .in>img,.bar .ttl{align-self:center}
.bar .sl{align-self:center;width:3px;height:34px;background:#3d4148;transform:skewX(-22deg);flex:none}
.bar h1{font-size:24px;font-weight:700;letter-spacing:-.01em;line-height:1}
.bar .sub{font-size:12.5px;color:#9ea3ac;margin-top:4px}
.bar nav{gap:6px;align-self:stretch;flex-wrap:nowrap}
.bar nav button{position:relative;border-radius:0;padding:0 14px;background:none;color:#a3a8b0;font-weight:500;font-size:14px;display:flex;align-items:center}
.bar nav button:hover{color:#fff}
.bar nav button[aria-selected="true"]{background:none;color:#fff;font-weight:600}
.bar nav button[aria-selected="true"]::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:4px;background:var(--acc);clip-path:polygon(0 0,100% 0,calc(100% - 7px) 100%,0 100%)}
@media (max-width:720px){
 .bar .in{flex-wrap:wrap;row-gap:0;padding-top:14px}
 .bar nav{margin-left:-14px;width:calc(100% + 14px);overflow-x:auto;scrollbar-width:none;height:46px}
 .bar nav::-webkit-scrollbar{display:none}
 .bar nav button{flex:none}}
/* Formulario */
.ask{border-color:var(--line)}
.modes{background:none;padding:0;gap:0;border:1px solid var(--line)}
.modes button{border-radius:0;padding:9px 6px;color:var(--muted);font-weight:500}
.modes button+button{border-left:1px solid var(--line)}
.modes button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1.5px var(--ink)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.sw{background:var(--bg)}
.go{background:var(--acc);color:#fff;border-radius:0}
.go:hover:not(:disabled){background:var(--acc-2)}

.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.linkb,.ex button{color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--faint)}
.pulse{background:var(--acc)}
.notice{background:var(--panel);border:1px solid var(--line)}

.verdict{border-left:4px solid var(--acc)}

.idle{border:0;padding:4px 0 0;gap:16px}
.idle h2{font-size:22px;font-weight:700;letter-spacing:-.01em}
.idle>p{margin:0;max-width:62ch}
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.excard{border:1px solid var(--line);background:var(--panel);border-radius:2px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:118px;color:var(--ink);font-size:14.5px;line-height:1.45;font-weight:500}
.excard .lbl{font-weight:400}
.excard:hover{border-color:var(--ink)}
.excard .arr{margin-top:auto;font-size:12.5px;color:var(--muted);font-weight:500}
.excard:hover .arr{color:var(--ink)}

<script>
const CAPAS=[
 ["transporte","Transporte","var(--f8)",["LR4 o LR1 hasta 10-20 km, ZR coherente para largos; LR1 y LR4 no interoperan.","DWDM multiplica la capacidad de las fibras existentes."]],
 ["olt","OLT y placas","var(--f1)",["Respetar la marca de OLT del cliente: define placas y ONT.","Hasta 16 puertos GPON (~1.000 abonados a 1:64), solo GPON y con AC: AN6001-G16.","Hasta 32 puertos o con camino a XGS-PON: AN6000-2. Hasta 112 puertos: AN6000-7.","Faltan puertos: placa GPON. Falta velocidad: combo 10G. Puertos largos: SFP C+ o C++.","Siempre: energía -48 V y uplink acorde."]],
 ["troncal","Troncal y distribución","var(--f2)",["Vanos de hasta 80 m: ASU 6, 12 o 24 F (800 N).","Vanos de 80 a 120 m con 24 F: ASU-24 de 120 m (2.000 N).","Troncal o más de 24 F con vano de 100 m: ADSS 12 a 144 F.","El diámetro del cable tiene que entrar en la caja de empalme."]],
 ["empalme","Empalme","var(--f3)",["FOSC-220J C104: hasta 48 F (96), entradas de 14 mm.","FOSC-220J A104: hasta 144 F, entradas de 18 mm, hasta 3 splitters."]],
 ["hub","HUB","var(--f4)",["Primer nivel de split; preconectorizado si el cliente no quiere fusionar."]],
 ["nap","NAP","var(--f5)",["Abonados por NAP y split final (1:8, 1:16); PLC para splits parejos."]],
 ["drop","Acometida","var(--f6)",["Tramo aéreo poste-casa: drop bow-type con acero, 1, 2 o 4 F.","Conector de campo (≤ 0,5 dB) o preconectorizado (≤ 0,3 dB) según el margen."]],
 ["ont","ONT","var(--f7)",["Misma marca que la OLT y versión verificada.","HG6145F3 para WiFi 6; HG6543D para volumen."]]];
const REGLAS=["Sos el PM de la línea FiberHome en Horizon Trading (distribuidor oficial en Argentina). Recomendá productos FiberHome. Solo si FiberHome no cubre la necesidad, mencioná otra marca que Horizon venda (ZTT en cables; Huawei en OLT, placas y energía) y aclaralo.",
"Horizon ya no vende ONT Huawei.",
"Nunca recomendar una ONT sin conocer marca, modelo y versión de la OLT del cliente. ONT FiberHome en OLT Huawei solo si el ISP tiene ACS de TR-069.",
"El alta de una ONT pasa por 5 pasos: 1 ranging (red física y potencia), 2 descubrimiento (si aparece como tipo desconocido es el software de la OLT), 3 autorización (SN, password o LOID), 4 perfiles por OMCI (con otra marca solo lo básico), 5 servicio y VLAN.",
"Ejemplo real: HG6145F3 en AN5516-01 con placas GC8B en RP1600 aparece como tipo desconocido; forzada como HG6145D anda internet pero no se gestiona el WiFi. Se resuelve con la combinación de versión de sistema y de placa que la soporte, confirmada con FiberHome.",
"Una ONT genérica que transmite fuera de su turno (rogue) puede cortar todo un puerto PON aunque la potencia esté bien.",
"Si la voz se corta con tráfico, revisar que esté en un T-CONT prioritario (tipo 1 o 2) y no en el best effort de internet.",
"Uplink saturado da lentitud y latencia en hora pico aunque la fibra esté perfecta.",
"No inventar datos técnicos ni precios. Lo que no esté en el catálogo, marcarlo como a confirmar con la hoja o con el product manager."];
const RED=["Arquitectura balanceada: 1:8 en la NAP + 1:8 en HUB/CTO = 64 clientes por puerto PON; variante de 3 niveles con cable de 1 F preconectorizado.",
"Cables: troncal 288 F (usar hasta ~83%) → subtroncal 144/72/48 F (un buffer de 12 F por NAP) → NAP → MPO 6 F hasta la HUB (4 FTTH, 1 reserva, 1 P2P; 50-200 m) → 1 F preconectorizado HUB-SUB (50-200 m) → drop (60-120 m).",
"NAP de referencia: 144 fusiones, 6 splitters 1:8, 14 salidas.",
"Clientes = hogares × penetración (60% inicial, hasta 85%) × 1,18; puertos PON = clientes ÷ 64.",
"Zona por NAP: 232 a 416 hogares según densidad (hasta 832 con 2 NAP). Hasta 20 NAP por troncal de 288 F.",
"Potencia con C+: pérdida máxima 31 dB, diseñar con 2 dB de margen, hasta ~20 km (C++ ~30 km).",
"Reservas: 40 m cada 360 m, 40 m por caja de empalme, 30 m en la central, 40 m a cada lado de cruces.",
"Solución preconectorizada FiberHome: MPO 461D → 462A → 463A y cables FastConnect."];
const MODES={vender:{n:"Buscar producto",ph:"Pegá lo que te escribió el cliente o describí su red: OLT, abonados, planes, tendido, vanos…",ex:["WISP que arranca en fibra: 500 abonados, sin sala técnica","ISP con OLT AN5516, 800 abonados, quiere ofrecer WiFi 6","Barrio de 400 hogares, tendido aéreo: diseñá la red"]},
 diag:{n:"Buscar por síntoma",ph:"Contá el síntoma: qué ve el técnico en la OLT, qué ONT, qué versión, desde cuándo…",ex:["La OLT ve la ONT pero dice tipo desconocido","Se cortan todos los abonados del puerto 5 cada tanto, la potencia está bien","Instalé ONT nuevas y no puedo configurar el WiFi desde la OLT"]},
 equiv:{n:"Buscar equivalente",ph:"Pegá el modelo o la especificación que pide el cliente o el pliego…",ex:["Me piden ONT Huawei EG8145X6, ¿qué FiberHome le doy?","Cable ADSS 48 FO vano 200 m","Caja NAP 16 puertos preconectorizada SC/APC"]}};
MODES.cotizar={n:"Revisar cotización",ph:"Pegá los ítems de la cotización (sin precios). Ej.: CHS STE + 4 PCB CGCBCM (CGHF Combo C+) + Módulo RCT100",ex:["CHS STE + 4 PCB CGCBCM (CGHF Combo C+) + Módulo RCT100"]};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const fmtD=s=>{if(!s)return"";const d=new Date(s);return isNaN(d)?String(s).slice(0,10):d.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"2-digit"})};
const st={compat:[],reglas:[],view:"consultar",mode:"vender",pedido:"",cliente:"",think:false,propuesta:"",prods:[],casos:[],caseSearch:"",caseFilter:"",caseEditing:undefined,db:null,sample:null,dl:null,ans:null,ansMode:null,quoteFile:"",busy:false,err:"",q:"",capa:"",marca:"FiberHome"};
try{const v=localStorage.getItem("pmfh_view");if(v&&["consultar","casos","catalogo","herramientas","diseno"].includes(v))st.view=v;const m=localStorage.getItem("pmfh_mode");if(m&&MODES[m])st.mode=m;st.think=localStorage.getItem("pmfh_think")==="1"}catch{}
const pById=id=>st.prods.find(p=>p.id===id);
const capa=k=>CAPAS.find(c=>c[0]===k);
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2400)}
const pdfHref=f=>f.url?f.url:"/_blob/"+f.id;
async function copy(txt){try{await navigator.clipboard.writeText(txt);toast("Copiado")}catch{const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("Copiado")}catch{toast("Seleccioná y copiá a mano")}ta.remove()}}

function catalogo(){return st.prods.map(p=>({id:p.id,nombre:p.nombre,marca:p.marca,capa:capa(p.capa)?.[1]||"",resumen:p.resumen,estado:p.estado||"falta",fuente:p.fuente||"",specs:(p.specs||[]).map(x=>x[0]+": "+x[1]).join(" | "),cuidar:(p.ojo||[]).join(" | "),cliente:p.clienteIdeal||"",competencia:p.familia==="competencia"}))}
function contexto(){return "REGLAS:\n- "+REGLAS.join("\n- ")+"\n\nCÓMO SE ELIGE POR CAPA:\n"+CAPAS.map(c=>c[1]+": "+c[3].join(" ")).join("\n")+"\n\nDISEÑO DE RED (buenas prácticas de ODN balanceada):\n- "+RED.join("\n- ")+"\n\nCATÁLOGO (usá solo estos productos, por id; estado completo/parcial/falta y fuente gobiernan qué es verificable):\n"+JSON.stringify(catalogo())}

function render(){
  $$(".bar nav button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.view===st.view)));
  $("#main").innerHTML=({consultar:vConsultar,casos:vCasos,catalogo:vCatalogo,herramientas:vTools,diseno:()=>`<div id="editor-slot"></div>`}[st.view]||vConsultar)();
  if(st.view==="herramientas"){calcPO();calcOLT();calcUp()}
  if(st.view==="diseno")edShow();else edHide();
}

/* ---------- Consultar ---------- */
function vConsultar(){
  const M=MODES[st.mode];
  const ask=`<section class="ask" aria-label="Pedido">
   <div class="modes" role="group" aria-label="Tipo de consulta">${Object.entries(MODES).map(([k,m])=>`<button type="button" data-mode="${k}" aria-pressed="${st.mode===k}">${m.n}</button>`).join("")}</div>
   <div class="field"><label for="cq">${st.mode==="diag"?"Síntoma":st.mode==="equiv"?"Qué pide el cliente":"Pedido del cliente"}</label><textarea id="cq" placeholder="${esc(M.ph)}">${esc(st.pedido)}</textarea></div>
   ${st.mode==="cotizar"?`<div class="field"><label for="qfile">Subir cotización (.txt, .csv, .xlsx, .xls o .pdf)</label><input id="qfile" type="file" accept=".txt,.csv,.xlsx,.xls,.pdf,text/plain,application/pdf"><p class="hint">El archivo se lee en esta sesión, no se guarda. Revisá que el texto extraído coincida con la cotización.</p>${st.quoteFile?`<p class="hint">Archivo leído: ${esc(st.quoteFile)}</p>`:""}</div>`:""}
   <div class="field"><label for="cc">Cliente <span style="font-weight:400;color:var(--muted)">(opcional, para tus casos)</span></label><input id="cc" value="${esc(st.cliente)}" placeholder="Ej.: Cablenet"></div>
   <button class="go" type="button" id="go" ${st.busy||!st.db?"disabled":""}>${st.busy?"Analizando…":"Buscar en fichas"}</button>
   ${!st.db?`<p class="hint">Conectá la base de fichas en Claude para consultar.</p>`:""}
   ${st.err?`<p class="err" role="alert">${esc(st.err)}</p>`:""}</section>`;
  let out;
  if(st.busy)out=`<div class="thinking"><span class="pulse"></span>El PM está revisando el catálogo, las reglas y tu caso…</div>`;
  else if(st.ans)out=vDictamen(st.ans,st.ansMode);
  else out=`<div class="idle"><span class="lbl">${esc(M.n)}</span><h2>¿Qué tenés que resolver?</h2><p class="hint" style="font-size:13.5px">Escribí el pedido a la izquierda o arrancá con uno de estos casos. Cada respuesta separa lo confirmado de lo que falta verificar.</p><div class="exgrid">${M.ex.map((e,i)=>`<button type="button" class="excard" data-ex="${esc(e)}"><span class="lbl">Caso ${i+1}</span>${esc(e)}<span class="arr">Usar este caso →</span></button>`).join("")}</div></div>`;
  return `<div class="grid">${ask}<div class="out">${out}</div></div>`;
}
function keysOf(p,n=3){return (p.specs||[]).slice(0,n)}
function bom(items){
  const rows=items.map(r=>({...r,p:pById(r.id)})).filter(r=>r.p);
  if(!rows.length)return "";
  const order=CAPAS.map(c=>c[0]);
  const groups=[...new Set(rows.map(r=>r.p.capa))].sort((a,b)=>order.indexOf(a)-order.indexOf(b));
  return `<div class="bom">${groups.map(g=>{const c=capa(g)||[g,g,"var(--f5)"];return `<div class="cap"><div class="cn"><span class="fd" style="background:${c[2]}"></span>${esc(c[1])}</div><div class="items">${rows.filter(r=>r.p.capa===g).map(({p,porque,ajuste,claves})=>{
    const ks=(Array.isArray(claves)&&claves.length?claves.map(x=>String(x).split(/:\s*/)):keysOf(p)).slice(0,3);
    return `<div class="it"><span class="nm">${esc(p.nombre)}</span>${porque?`<p class="why">${esc(porque)}</p>`:""}${ks.length?`<div class="ks">${ks.map(k=>`<span><b>${esc(k[0])}</b> ${esc(k.slice(1).join(": "))}</span>`).join("")}</div>`:""}
     <div class="side"><span class="fit ${esc(ajuste||"exacto")}">${{exacto:"Se ajusta",alternativa:"Alternativa",no:"No ideal"}[ajuste]||"Se ajusta"}</span><div class="ico"><button class="ib" type="button" data-pid="${esc(p.id)}">Ficha</button>${(p.pdfs||[]).slice(0,1).map(f=>`<a class="ib pdf" href="${esc(pdfHref(f))}" target="_blank" rel="noopener">PDF</a>`).join("")}</div></div></div>`}).join("")}</div></div>`}).join("")}</div>`;
}
function caseProductIds(c){return Array.isArray(c.productos)?c.productos.filter(x=>typeof x==='string'):Array.isArray(c.producto_ids)?c.producto_ids.filter(x=>typeof x==='string'):[]}
function caseCount(id){return st.casos.filter(c=>caseProductIds(c).includes(id)).length}
function caseLink(id){return `<button type="button" class="linkb" data-caseprod="${esc(id)}">Casos: ${caseCount(id)}</button>`}
function caseCandidateIds(){const a=st.ans||{};return [...new Set([...(a.productos||[]).slice(0,3).map(x=>x.id),...(a.items||[]).slice(0,3).map(x=>x.producto_id)].filter(id=>pById(id)))]}
function compactNotes(items,label){
 const a=Array.isArray(items)?items:[];if(!a.length)return '';
 const list=rows=>`<ul>${rows.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`;
 return `<div class="sub">${esc(label)}</div>${list(a.slice(0,3))}${a.length>3?`<details><summary>Ver todo (${a.length})</summary>${list(a.slice(3))}</details>`:''}`;
}
function vDictamen(a,mode){
 if(mode==="cotizar")return vCotizacion(a);
 const arr=x=>Array.isArray(x)?x:[];
 let h=`<section class="verdict"><span class="lbl">Consultar · búsqueda documental sin IA</span><p class="c">${esc(a.conclusion)}</p></section>`;

   <div class="res"><div><span>A 3 años</span><b id="oT"></b></div><div><span>Puertos PON</span><b id="oP"></b></div><div><span>Placas</span><b id="oPl"></b></div></div>
   <div class="vd ok" id="oR"></div><div class="chips" id="oProd"></div></section>
  <section class="tool"><h3>¿Le alcanza el uplink?</h3><p>Pico = abonados × plan × simultaneidad. Arriba del 70-80% el abonado lo siente.</p>

const f1=n=>n.toFixed(1).replace(".",",");
function calcPO(){const tx=+$("#poC").value,s=+$("#poS").value,k=+$("#poK").value,n=+$("#poN").value,e=+$("#poE").value;$("#poKo").textContent=k+" km";$("#poNo").textContent=n;$("#poEo").textContent=e;
  const L=s+k*.3+n*.3+e*.1,R=tx-L,M=R+27;$("#poL").textContent=f1(L)+" dB";$("#poR").textContent=f1(R)+" dBm";$("#poM").textContent=f1(M)+" dB";
  const v=$("#poV");if(M>=3){v.className="vd ok";v.textContent="Engancha con margen sano."}else if(M>=0){v.className="vd warn";v.textContent="Engancha justo: SFP C+ en este puerto."}else{v.className="vd bad";v.textContent="No engancha: faltan "+f1(-M)+" dB. Bajar el split, acortar o pasar a C+."}}
function calcOLT(){const ab=Math.max(1,+$("#oA").value||0),cr=Math.max(0,+$("#oC").value||0),sp=+$("#oS").value,tot=Math.ceil(ab*(1+cr/100)),pon=Math.ceil(tot/sp),plc=Math.ceil(pon/16);
  $("#oT").textContent=tot.toLocaleString("es-AR");$("#oP").textContent=pon;$("#oPl").textContent=plc;let r,ids;
  if(pon<=16&&tot<=2048){r=`AN6001-G16: usa ${pon} de 16 puertos. Solo GPON; para 10G, AN6000-2.`;ids=["an6001-g16","sfp-pon","an6000-2"]}
  else if(pon<=32&&tot<=4096){r=`AN6000-2 con ${plc} placa${plc>1?"s":""} de 16 puertos.`;ids=["an6000-2","placas-olt","sfp-pon"]}
  else if(pon<=112&&tot<=8192){r=`AN6000-7 con ${plc} placa${plc>1?"s":""} y ${Math.max(0,7-plc)} slot${7-plc===1?"":"s"} libre${7-plc===1?"":"s"}. Sumá energía -48 V.`;ids=["an6000-7","placas-olt","sfp-pon","fuente-etp48100"]}
  else{r=`Supera una AN6000-7 (${pon} puertos): AN6000-15 o dos chasis.`;ids=["placas-olt"]}
  $("#oR").textContent=r;$("#oProd").innerHTML=ids.map(pl).join("")}
function calcUp(){const a=Math.max(1,+$("#uA").value||0),p=Math.max(1,+$("#uP").value||0),s=+$("#uS").value,u=+$("#uU").value;$("#uSo").textContent=s+"%";
  const pk=a*p*s/100/1000,oc=pk/u*100,per=u*1000/(a*s/100);$("#uT").textContent=f1(pk)+" Gbps";$("#uO").textContent=Math.round(oc)+"%";$("#uX").textContent=Math.round(Math.min(per,p))+" Mbps";
  const v=$("#uV");if(oc<=70){v.className="vd ok";v.textContent="Alcanza con margen para crecer."}else if(oc<=100){v.className="vd warn";v.textContent="Al límite en hora pico: planificar el salto de uplink."}else{v.className="vd bad";v.textContent="Saturado: lentitud y latencia aunque la fibra esté perfecta."}}

/* ---------- Diseño ---------- */
const DZPROMPT_DEF="ROL\nSos un diseñador gráfico senior y director de arte, con 15 años de experiencia y base sólida en Adobe Illustrator. Te especializás en piezas de marketing B2B para telecomunicaciones (ISP, WISP, cooperativas y cableoperadores de Argentina). Trabajás para Horizon Trading y sos el responsable de que cada flyer salga terminado, como lo entregaría un estudio profesional.\n\nCÓMO TRABAJÁS (MÉTODO ILLUSTRATOR)\n- Mesas de trabajo: Chat 1080 × 1350 px y Estado 1080 × 1920 px, en RGB, para pantalla.\n- Grilla: márgenes laterales de 72 px, retícula base de 8 px, todo alineado a la grilla y a la mesa de trabajo (panel Alinear). Nada \"a ojo\".\n- Capas ordenadas: Fondo, Marca, Títulos, Producto, Tabla, Atributos, Datos y Pie.\n- Tipografía: Poppins. Jerarquía por peso y tamaño, no por cantidad de colores. Tracking amplio solo en etiquetas en mayúsculas. Cuerpo mínimo legible en el celular: 22 px. Sin viudas, sin cortes feos, sin textos que toquen bordes.\n- Color con muestras globales de Horizon: fondo violeta oscuro #24213A, tarjetas #2E2A48, etiqueta #3A3566, verde #3DDC84 como único acento (bajada, precio y firma), azul #3B7DDD en los íconos hexagonales, texto blanco y gris lavanda. Contraste suficiente para leer en el celular.\n- Imágenes: foto de producto recortada, escalada en proporción (nunca deformada), con sombra paralela suave. Siempre la foto real del modelo que se vende.\n- Íconos: mismo estilo y grosor de trazo, centrados ópticamente dentro del hexágono.\n- Exportación: PNG para WhatsApp y SVG con textos editables para abrir en Illustrator.\n\nLA BASE ES EL MODELO DE HORIZON Y NO SE CAMBIA\nCada flyer son dos piezas con la misma estructura:\n- Portada: logo HORIZON arriba a la izquierda, etiqueta redondeada arriba a la derecha (ej. STOCK LOCAL), bajada verde en mayúsculas espaciadas, subtítulo gris, tarjeta grande con la foto del equipo, datos en chips, la categoría en mayúsculas (ej. SWITCH) y el precio; debajo tres atributos con íconos hexagonales azules, el logo de la marca centrado y el pie oscuro con WhatsApp, teléfono, firma \"Escuchar para Conectar\", mail y aclaración de precios.\n- Detalle: logo y etiqueta, bajada verde, categoría enorme (ej. SWITCH), el uso en mayúsculas (ej. ACCESO GIGABIT PoE+), logo de la marca, foto del equipo a la derecha, tabla MODELO / USD + IVA con una fila por modelo (código en negrita, descripción corta y precio en verde), tres atributos con íconos, datos clave en tarjetas y el mismo pie.\nVos completás y pulís el contenido dentro de esa estructura. No rediseñás, no agregás bloques, no cambiás colores ni tipografía.\n\nCRITERIO DE COMUNICACIÓN\n- Un solo mensaje por flyer. El comprador entiende en 2 segundos qué se vende y a qué precio.\n- Todo dato sale de la ficha del producto o del pedido. Nunca inventes especificaciones ni precios: si el pedido no trae precio, dejalo vacío.\n- La etiqueta y la bajada no se repiten entre sí (ej. etiqueta STOCK LOCAL y bajada ENTREGA INMEDIATA).\n- Atributos: 1 a 3 palabras, verdaderos para este equipo y elegidos por lo que le importa al comprador técnico. Nada de \"alta capacidad\" o \"alta disponibilidad\" si un dato no lo respalda. A cada uno, el ícono que mejor lo explique.\n- Datos clave: hasta 4, con un valor corto y grande (ej. 24, 4 × 1G, 56 Gbit/s) y una etiqueta de hasta 4 palabras.\n- Descripción de cada modelo: hasta 8 palabras.\n- Precio con el formato de Horizon: USD 546,00. \"Desde\" solo si hay más de un modelo.\n- Si el pedido contradice la ficha (ej. dice agregación y el equipo es de acceso), corregilo y avisalo. Si falta un dato que el comprador va a preguntar sí o sí (ej. potencia PoE total), marcalo como faltante.\n- Español rioplatense, directo, sin signos de exclamación.\n\nPROCESO\n1. Leés la ficha y el pedido.\n2. Definís el mensaje único y para quién es.\n3. Definís la jerarquía: qué se lee primero, segundo y tercero.\n4. Escribís cada texto dentro de los límites de su espacio en el modelo.\n5. Chequeás cada dato contra la ficha.\n6. Revisás la pieza terminada como director de arte: alineación, espaciado, legibilidad, foto correcta y que nada quede vacío ni amontonado.\n\nCÓMO RESPONDÉS\nConcreto y profesional. Cuando corregís algo, decís qué cambiar y cuánto, en términos de Illustrator si sirve (ej. \"subí el precio a 34 px\", \"alineá la foto al centro de la tarjeta\", \"tracking +300 en la etiqueta\").";

/* ---- escena: una sola descripción que se dibuja en canvas y se exporta en SVG ---- */
const MC=document.createElement("canvas").getContext("2d");
const UP=t=>String(t).toUpperCase().replace(/POE/g,"PoE");
function F(w,s){return `${w} ${s}px Poppins, system-ui, sans-serif`}
function mw(t,w,s,ls=0){MC.font=F(w,s);let x=MC.measureText(t).width;if(ls)x+=ls*Math.max(0,[...t].length-1);return x}
function fit(t,maxW,s,min,w,ls=0){let z=s;while(z>min&&mw(t,w,z,ls)>maxW)z-=1;return z}
function wrapT(t,maxW,w,s,maxL){const ws=String(t).split(/\s+/).filter(Boolean),L=[];let c="";for(const x of ws){const n=c?c+" "+x:x;if(mw(n,w,s)<=maxW)c=n;else{if(c)L.push(c);c=x}}if(c)L.push(c);if(L.length>maxL){L.length=maxL;let l=L[maxL-1];while(l&&mw(l+"…",w,s)>maxW)l=l.slice(0,-1);L[maxL-1]=l.trimEnd()+"…"}return L}

async function dzV2CropAlpha(url){
 if(!url)return null;
 const im=await dzImg(url);if(!im)return null;
 const cv=document.createElement('canvas');cv.width=im.naturalWidth||im.width;cv.height=im.naturalHeight||im.height;
 if(cv.width*cv.height>16000000)return {src:url,img:im};
 const cx=cv.getContext('2d',{willReadFrequently:true});cx.drawImage(im,0,0);
 let pixels;try{pixels=cx.getImageData(0,0,cv.width,cv.height)}catch{return {src:url,img:im}}
 let minX=cv.width,minY=cv.height,maxX=-1,maxY=-1;
 const a=pixels.data;
 for(let y=0;y<cv.height;y++)for(let x=0;x<cv.width;x++)if(a[(y*cv.width+x)*4+3]>10){if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y}
 if(maxX<0)return {src:url,img:im};
 if(minX===0&&minY===0&&maxX===cv.width-1&&maxY===cv.height-1)return {src:url,img:im};
 const out=document.createElement('canvas');out.width=maxX-minX+1;out.height=maxY-minY+1;
 out.getContext('2d').putImageData(cx.getImageData(minX,minY,out.width,out.height),0,0);
 const src=out.toDataURL('image/png');return {src,img:await dzImg(src)};
}

    else if(e.t==="rich"){const tot=e.parts.reduce((s,[t,z,w])=>s+mw(t,w,z),0);let x=e.a==="middle"?e.x-tot/2:e.x;for(const [t,z,w,col] of e.parts){if(!t)continue;c.font=F(w,z);c.fillStyle=col;c.fillText(t,x,e.y);x+=mw(t,w,z)}}
    c.restore()}}

function xmlE(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
async function aDataUrl(src){if(!src||src.startsWith("data:"))return src;try{const b=await (await fetch(src)).blob();return await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)})}catch{return src}}
async function aSVG(S,W,H){const groups={};const order=[];const urls={};for(const e of S)if(e.t==="img"&&!urls[e.src])urls[e.src]=await aDataUrl(e.src);
  for(const e of S){const g=e.g||"Fondo";if(!groups[g]){groups[g]=[];order.push(g)}let o="";
    if(e.t==="rect")o=`<rect x="${e.x}" y="${e.y}" width="${e.w}" height="${e.h}" rx="${e.r||0}" fill="${e.glow?"url(#glow)":e.fill}"${e.line?` stroke="${e.line}" stroke-width="1.5"`:""}/>`;
    else if(e.t==="hex"||e.t==="poly")o=`<polygon points="${(e.pts||hexPts(e.cx,e.cy,e.r)).map(p=>p.map(v=>v.toFixed(1)).join(",")).join(" ")}" fill="${e.fill||"none"}"${e.stroke?` stroke="${e.stroke}" stroke-width="${e.lw}"`:""}/>`;
    else if(e.t==="line")o=`<line x1="${e.x1}" y1="${e.y1}" x2="${e.x2}" y2="${e.y2}" stroke="${e.stroke}" stroke-width="${e.lw}"/>`;
    else if(e.t==="icon")o=`<path d="${e.d}" transform="translate(${e.x} ${e.y}) scale(${e.s/24})" fill="none" stroke="${e.stroke}" stroke-width="${e.lw*24/e.s}" stroke-linecap="round" stroke-linejoin="round"/>`;
    else if(e.t==="img"){
      let behind="";
      if(e.shadow){const im=await dzImg(e.src);if(im){const sc=document.createElement('canvas');sc.width=W;sc.height=H;dzContactShadow(sc.getContext('2d'),im,e);behind=`<image x="0" y="0" width="${W}" height="${H}" href="${sc.toDataURL('image/png')}"/>`;}}
      o=behind+`<image x="${e.x.toFixed(1)}" y="${e.y.toFixed(1)}" width="${e.w.toFixed(1)}" height="${e.h.toFixed(1)}" href="${xmlE(urls[e.src])}"/>`;
    }
    else if(e.t==="text"){const an=e.a==="middle"?"middle":e.a==="end"?"end":"start";o=`<text x="${e.x.toFixed(1)}" y="${e.y.toFixed(1)}" font-family="Poppins" font-size="${e.s}" font-weight="${e.w}" fill="${e.fill}" text-anchor="${an}"${e.ls?` letter-spacing="${e.ls}"`:""}>${xmlE(e.txt)}</text>`}
    else if(e.t==="rich"){o=`<text x="${e.x}" y="${e.y}" font-family="Poppins" text-anchor="${e.a==="middle"?"middle":"start"}">${e.parts.filter(p=>p[0]).map(([t,z,w,col])=>`<tspan font-size="${z}" font-weight="${w}" fill="${col}">${xmlE(t)}</tspan>`).join("")}</text>`}
    if(o)groups[g].push(o)}
  return `<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">\n<defs><radialGradient id="glow" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#38335a"/><stop offset="1" stop-color="${BR.card}"/></radialGradient><filter id="sombra" x="-10%" y="-30%" width="120%" height="180%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity="0.45"/></filter></defs>\n${order.map(g=>`<g id="${xmlE(g)}">\n${groups[g].join("\n")}\n</g>`).join("\n")}\n</svg>\n`}

async function dzV2ImageData(img){const w=img.width,h=img.height;if(!w||!h||w*h>12000000)return null;const c=document.createElement('canvas');c.width=w;c.height=h;const cx=c.getContext('2d');if(img.bitmap){cx.drawImage(img.bitmap,0,0);return c.toDataURL('image/png')}
 const buf=img.data;if(!buf)return null;let rgba=cx.createImageData(w,h);const kind=img.kind;for(let i=0;i<w*h;i++){if(buf.length===w*h*4){rgba.data.set(buf);break}if(buf.length===w*h*3){rgba.data[i*4]=buf[i*3];rgba.data[i*4+1]=buf[i*3+1];rgba.data[i*4+2]=buf[i*3+2];rgba.data[i*4+3]=255}else if(buf.length===w*h){rgba.data[i*4]=rgba.data[i*4+1]=rgba.data[i*4+2]=buf[i];rgba.data[i*4+3]=255}else return null}cx.putImageData(rgba,0,0);return c.toDataURL('image/png')}
async function dzV2StoreImportedImage(dataUrl,name){
 const temporary={id:null,url:dataUrl};if(!st.dz.assets?.upload)return temporary;
 try{const blob=await (await fetch(dataUrl)).blob();const file=new File([blob],name,{type:'image/png'});const res=await st.dz.assets.upload(file);return res?.id?{id:res.id,url:res.url||'/_blob/'+res.id}:temporary}catch{return temporary}
}
async function dzV2PdfImport(file){
 if(!file||!window.pdfjsLib){toast('Lector PDF no disponible');return}
 const D=st.dz;D.busy=true;D.err='';render();
 try{
  const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const fuentes=[],images=[],specs=[],facts=[];let modelo='';
  for(let n=1;n<=pdf.numPages;n++){
   const page=await pdf.getPage(n),tx=await page.getTextContent();
   const items=tx.items.filter(x=>String(x.str||'').trim()).map(x=>({str:String(x.str).trim(),size:Math.abs(x.transform?.[3]||x.height||0),y:x.transform?.[5]||0,x:x.transform?.[4]||0}));
   const lines=items.map(x=>x.str);fuentes.push({pagina:n,texto:lines.join(' '),lineas:lines});
   if(n===1){const tops=items.filter(x=>/\b[A-Z]{1,8}[-_]?[A-Z0-9-]*\d[A-Z0-9-]*\b/i.test(x.str)&&x.str.length<75).sort((a,b)=>b.size-a.size);modelo=tops[0]?.str||''}
   for(let i=0;i<lines.length;i++){
    let line=lines[i],m=line.match(/^([^:：]{2,55})\s*[:：]\s*(.{1,160})$/);
    if(!m&&/^(Wi-?Fi|WLAN|Ethernet|LAN|GPON|PON|SSID|MIMO|TR-069|USB|FXS|POTS|Power|Security|Standard|Ports?)\b/i.test(line)&&lines[i+1]&&!/:/.test(lines[i+1]))m=[null,line,lines[++i]];
    if(m){const label=m[1].trim(),value=m[2].trim();if(label&&value&&!specs.some(x=>x[0].toLowerCase()===label.toLowerCase()))specs.push([label,value]);facts.push({pagina:n,texto:label+': '+value})}
   }
   const ops=await page.getOperatorList(),names=[];
   for(let i=0;i<ops.fnArray.length;i++){const fn=ops.fnArray[i],a=ops.argsArray[i]||[];if(fn===pdfjsLib.OPS.paintImageXObject||fn===pdfjsLib.OPS.paintJpegXObject)if(typeof a[0]==='string')names.push(a[0])}
   for(const name of [...new Set(names)])try{
    const obj=await new Promise((resolve,reject)=>{let done=false;const t=setTimeout(()=>{if(!done){done=true;reject(Error('timeout'))}},2500);page.objs.get(name,v=>{if(!done){done=true;clearTimeout(t);resolve(v)}})});
    const url=await dzV2ImageData(obj);if(url){const im=await dzImg(url);if(!im)continue;const cv=document.createElement('canvas');cv.width=im.width;cv.height=im.height;const ctx=cv.getContext('2d',{willReadFrequently:true});ctx.drawImage(im,0,0);const pix=ctx.getImageData(0,0,cv.width,cv.height).data;let alpha=false,solid=false;for(let j=3;j<pix.length;j+=4){if(pix[j]<250)alpha=true;else solid=true;if(alpha&&solid)break}images.push({pagina:n,url,w:im.width,h:im.height,area:im.width*im.height,alpha})}
   }catch{}
  }
  D.f.fuente={archivo:file.name,paginas:fuentes,imagenes:images.map(({pagina,w,h,alpha})=>({pagina,ancho:w,alto:h,alpha})),datos:facts,fecha:new Date().toISOString()};
  const pics=images.filter(x=>x.w>=160&&x.h>=100).sort((a,b)=>b.area-a.area);if(pics.length){D.f.foto=await dzV2StoreImportedImage(pics[0].url,'foto-importada.png');if(!D.f.foto?.id)D.alertas.push('Foto temporal: subir archivo persistente antes de guardar.')}
  const duplicatePages=new Map();for(const im of images){const key=im.url;const pages=duplicatePages.get(key)||new Set();pages.add(im.pagina);duplicatePages.set(key,pages)}
  const logos=images.filter(x=>x.alpha&&x.w>=300&&x.w/x.h>=2.5&&x.w/x.h<=4.5&&(duplicatePages.get(x.url)?.size||0)<2).sort((a,b)=>b.w-a.w);
  D.f.logo=null;if(logos.length){D.f.logo=await dzV2StoreImportedImage(logos[0].url,'logo-importado.png');if(!D.f.logo?.id)D.alertas.push('Logo temporal: subir archivo persistente antes de guardar.')}
  const base=pById(D.pid);const fam=dzV2Fam(base||{familia:'ont'});
  const translations={'ports':'Puertos','port':'Puertos','power consumption':'Consumo','dimensions':'Dimensiones','weight':'Peso','wi-fi':'WiFi','wifi':'WiFi'};
  const allowed=new Set(DZV2[fam].prior);
  const cleanSpecs=specs.map(([label,value])=>{const l=label.trim();const translated=translations[l.toLowerCase()]||l;return [translated,value]})
    .filter(([label,value])=>allowed.has(dzV2Key(label))&&value&&!/power adapter input|triple play service/i.test(label));
  const parsed={...(base||{}),nombre:modelo||base?.nombre||file.name.replace(/\.pdf$/i,''),marca:base?.marca||'FiberHome',familia:base?.familia||'ont',capa:base?.capa||'ont',estado:'parcial',specs:cleanSpecs};
  if(!cleanSpecs.length)D.alertas.push('No se identificaron especificaciones prioritarias para esta familia. Revisar manualmente el datasheet.');
  const out=dzV2Build(parsed,'');dzVolcar(out);D.faltan=out.faltan;D.alertas=[...D.alertas,...out.alertas,'Verificar modelo y especificaciones extraídos antes de publicar.'];D.crit=out.criterio;
  toast('Datasheet: '+pdf.numPages+' páginas · '+specs.length+' especificaciones · '+images.length+' imágenes');
 }catch(e){D.err='No se pudo importar el datasheet: '+e.message}finally{D.busy=false;render()}
}

function dzV2Clean(k,v){let x=String(v||'').trim();if(k==='wifi'){x=/802\.11[^,;]*\bax\b/i.test(x)?'WiFi 6':/802\.11[^,;]*\bac\b/i.test(x)?'WiFi 5':/802\.11[^,;]*\bn\b/i.test(x)?'WiFi 4':x}return x}

async function edCompare(){if(!ed.ready)return;const {w,h}=FMT[ed.format],scene=ed.sceneSource[ed.piece]||[];if(!scene.length)return edStatus('Sin escena original para comparar');const ref=document.createElement('canvas');ref.width=w;ref.height=h;await pintar(ref,scene);const other=document.createElement('canvas');other.width=w;other.height=h;ed.canvas.discardActiveObject();ed.canvas.renderAll();const view=ed.canvas.toDataURL({format:'png',multiplier:1/ed.zoom});const im=new Image();await new Promise((res,rej)=>{im.onload=res;im.onerror=rej;im.src=view});other.getContext('2d').drawImage(im,0,0,w,h);const a=ref.getContext('2d').getImageData(0,0,w,h).data,b=other.getContext('2d').getImageData(0,0,w,h).data,diff=document.createElement('canvas');diff.width=w;diff.height=h;const ctx=diff.getContext('2d'),out=ctx.createImageData(w,h);let changed=0;for(let i=0;i<a.length;i+=4){const d=Math.max(Math.abs(a[i]-b[i]),Math.abs(a[i+1]-b[i+1]),Math.abs(a[i+2]-b[i+2]),Math.abs(a[i+3]-b[i+3]));if(d>25){changed++;out.data[i]=255;out.data[i+3]=255}}ctx.putImageData(out,0,0);const percent=(100*changed/(w*h)).toFixed(2);let modal=document.getElementById('ed-compare-modal');if(!modal){modal=document.createElement('dialog');modal.id='ed-compare-modal';modal.style.cssText='max-width:min(90vw,850px);max-height:90vh;background:#202734;color:#fff;border:1px solid #789;padding:18px;z-index:150';document.body.appendChild(modal)}modal.innerHTML=`<h3>Comparación ${edEsc(ed.piece)} · ${edEsc(ed.format)}</h3><p>Pixeles diferentes (umbral 25): ${percent}%. Objetivo: menos del 1%.</p><img style="width:100%;max-height:60vh;object-fit:contain;background:#111" src="${diff.toDataURL('image/png')}"><p><button id="ed-compare-close">Cerrar</button></p>`;modal.querySelector('#ed-compare-close').onclick=()=>modal.close();modal.showModal()}
async function edCanvasSVG(){const parts=[];for(const o of ed.canvas.getObjects()){let svg=o.toSVG();const urls=[...svg.matchAll(/(?:href|xlink:href)=['"]([^'"]+)['"]/g)].map(m=>m[1]);for(const url of new Set(urls)){if(/\/_blob\//.test(url)){const data=await aDataUrl(url);if(!data.startsWith('data:'))throw Error('No se pudo incrustar la imagen '+url);svg=svg.split(url).join(data)}}const layer=String(o.capa||'Producto').normalize('NFD').replace(/[\u0300-\u036f]/g,'');parts.push(`<g data-layer="${xmlE(layer)}" id="${xmlE(o.id||layer)}">${svg}</g>`)}const {w,h}=FMT[ed.format];return `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${parts.join('')}</svg>`}

    const reference = top.querySelector('[data-ed="compare"]');
    if (reference) reference.insertAdjacentElement('afterend', button);
    else top.appendChild(button);
    button.addEventListener('click', auditFour);
  }

  const observer = new MutationObserver(addButton);
  observer.observe(document.body, {subtree:true,childList:true});
  addButton();

  async function awaitCanvas(piece) {
    for (let j = 0; j < 100; j++) {
      const data = ed.doc[piece];
      if (!ed.restoring && ed.piece === piece && ed.canvas && data &&
          ed.canvas.getObjects().length === data.length) {
        await sleep(140);
        return;
      }
      await sleep(100);
    }
    throw new Error('No terminó de cargar la pieza ' + piece);
  }

  function htmlEscape(s) {
    return String(s ?? '').replace(/[&<>"']/g, a => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));
  }

  function reportHtml(results, metadata) {
    const count = results.filter(r => r.value !== null && r.value < 1).length;
    const allPass = count === 4;
    return `<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Auditoría PM FiberHome · 4 comparaciones</title>
    <style>body{font-family:Arial,sans-serif;background:#f3f5f7;color:#17212f;padding:25px;margin:auto;max-width:1250px}
    h1{margin-bottom:6px}p{color:#455466}table{width:100%;border-collapse:collapse;background:white;margin:22px 0}
    th,td{padding:13px;border-bottom:1px solid #dce2e6;text-align:left} .pass{color:#138449;font-weight:700}
    .fail{color:#be3030;font-weight:700} .na{color:#a86d00;font-weight:700}
    .shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
    figure{margin:0;padding:16px;background:white;border:1px solid #dce2e6}img{display:block;width:100%;max-height:700px;object-fit:contain;background:#15151c}
    figcaption{padding:8px 0;font-weight:700}</style></head><body>
    <h1>PM FiberHome — Auditoría de píxeles</h1>
    <p>Generado: ${htmlEscape(metadata.date)} · Foto cargada: ${metadata.photo ? 'Sí':'No'} · Umbral por píxel: 25 · Objetivo: menos del 1%.</p>
    <h2>${allPass ? 'Las 4 comparaciones cumplen el objetivo' : `${count}/4 comparaciones cumplen el objetivo`}</h2>
    <table><thead><tr><th>Formato</th><th>Pieza</th><th>Píxeles diferentes</th><th>Resultado</th></tr></thead><tbody>

    ${results.map(r=>`<figure><figcaption>${htmlEscape(r.fmt)} · ${htmlEscape(r.piece)} — ${r.value===null?'ERROR':r.value.toFixed(2)+'%'}</figcaption>${r.src?`<img src="${r.src}" alt="Diferencias de ${htmlEscape(r.fmt)} y ${htmlEscape(r.piece)}">`:`<p>${htmlEscape(r.error||'No disponible')}</p>`}</figure>`).join('')}
    </div><p>Medido por la función edCompare() incluida en el editor, sin sustituir su criterio. Las comparaciones corresponden a la escena de plantilla recién regenerada para cada formato.</p>
    </body></html>`;
  }

  function showReport(results, meta) {
    const html = reportHtml(results, meta);
    let dialog = document.getElementById('pm-audit-report');

      dialog = document.createElement('dialog');
      dialog.id = 'pm-audit-report';
      dialog.style.cssText = 'background:#fff;color:#17212f;width:min(95vw,1120px);max-width:95vw;max-height:95vh;z-index:2000;padding:22px;border:2px solid #13774d;overflow:auto';

        try {
          await st.dl.save({filename:'PM_FiberHome_auditoria_4_comparaciones.html', data:blob});
        } catch(err) {
          if (err?.code !== 'declined') toast('No se pudo descargar el informe');
        }

  }

  async function auditFour() {
    if (running) return;

          let value=null,src='',error='';
          try {
            edShowPiece(piece);
            await awaitCanvas(piece);

            const line=modal?.querySelector('p')?.textContent||'';
            const found=line.match(/:\s*([\d.,]+)%/);
            if(!found) throw new Error('El comparador no devolvió un porcentaje: '+line);
            value=Number(found[1].replace(',','.'));
            src=modal.querySelector('img')?.src||'';
            if(!src.startsWith('data:image/'))throw new Error('No se pudo capturar la imagen de diferencia');
            if (modal.open) modal.close();
          } catch(ex) {
            error=String(ex?.message||ex);

            if(modal?.open)modal.close();
          }
          results.push({fmt:fmt==='chat'?'Chat 1080×1350':'Estado 1080×1920',piece,value,src,error});
        }
      }
    } finally {
      ed.format=original.format;
      ed.el.querySelector('#ed-format').value=original.format;
      ed.doc=original.doc;
      ed.sceneSource=original.sceneSource;
      ed.piece=original.piece;
      if (!original.doc?.portada || !original.doc?.detalle) {
        await edGenerate(true);
      } else {
        edShowPiece(original.piece);
      }
      ed.currentId=original.currentId;
      ed.assets=original.assets;
      ed.history=original.history;
      ed.redo=original.redo;
      ed.dirty=original.dirty;
      await awaitCanvas(original.piece).catch(()=>{});
      edFit();
      button.disabled=false;
      button.textContent='Auditar 4 comparaciones';
      running=false;
    }
    showReport(results,meta);
  }
})();

  const ty=(T.match(/Typical\s*:?\s*(\d+(?:[.,]\d+)?)\s*W/i)||[])[1],mx=(T.match(/Max\s*:?\s*(\d+(?:[.,]\d+)?)\s*W/i)||[])[1];if(ty||mx)add('Consumo',[ty?ty+' W típico':'',mx?mx+' W máx.':''].filter(Boolean).join(', '));
  if((m=T.match(/Dimensions[^0-9]{0,20}(\d+)\s*mm?\s*[×x*]\s*(\d+)\s*mm?\s*[×x*]\s*(\d+)\s*mm/i)))add('Dimensiones',m[1]+' × '+m[2]+' × '+m[3]+' mm');
  if((m=T.match(/Weight\s*(\d+(?:[.,]\d+)?)\s*(k?g)\b/i)))add('Peso',m[1]+' '+m[2]);
  const fam=/\bONT\b|\bONU\b|GPON\s*\+\s*\d\s*\*\s*GE|HGU|Wi-?Fi Port/i.test(T)?'ONT':/\bOLT\b/.test(T)?'OLT':/switch/i.test(T)?'Switch':'';
  return {specs,fam};
}
dzV2PdfImport=async function(file){
  if(!file||!window.pdfjsLib){toast('Lector PDF no disponible');return}
  const D=st.dz;D.busy=true;D.err='';render();
  try{
    const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
    const fuentes=[],images=[];let modelo='',all='';
    for(let n=1;n<=pdf.numPages;n++){
      const page=await pdf.getPage(n),tx=await page.getTextContent();
      const items=tx.items.filter(x=>txt(x.str)).map(x=>({str:txt(x.str),size:Math.abs(x.transform?.[3]||x.height||0)}));
      const lines=items.map(x=>x.str);fuentes.push({pagina:n,texto:lines.join(' '),lineas:lines});all+=' '+lines.join(' ');
      if(n===1){const tops=items.filter(x=>/\d/.test(x.str)&&/[A-Z]/i.test(x.str)&&x.str.length<=24&&!/\s{2,}/.test(x.str)).sort((a,b)=>b.size-a.size);modelo=tops[0]?.str||''}
      const ops=await page.getOperatorList(),names=[];
      for(let i=0;i<ops.fnArray.length;i++){const fn=ops.fnArray[i],a=ops.argsArray[i]||[];if((fn===pdfjsLib.OPS.paintImageXObject||fn===pdfjsLib.OPS.paintJpegXObject)&&typeof a[0]==='string')names.push(a[0])}
      for(const name of [...new Set(names)])try{
        const obj=await new Promise((res,rej)=>{let done=false;const t=setTimeout(()=>{if(!done){done=true;rej(Error('timeout'))}},2500);page.objs.get(name,v=>{if(!done){done=true;clearTimeout(t);res(v)}})});
        const url=await dzV2ImageData(obj);if(!url)continue;const im=await dzImg(url);if(!im)continue;
        images.push({pagina:n,url,w:im.width,h:im.height,area:im.width*im.height,...imgStats(im)});
      }catch{}
    }
    const {specs,fam}=parseDatasheet(all);
    // Logo: forma de logo (2,4–4,6), sólido y con color; los banners decorativos tienen alfa difuso (solidez ~0)
    const logos=images.filter(x=>x.w>=300&&x.w/x.h>=2.4&&x.w/x.h<=4.6&&x.solid>=0.6&&x.sat>=40).sort((a,b)=>b.sat-a.sat||b.w-a.w);
    const logo=logos[0]||null;
    // Foto: la mayor imagen sólida (no banner ni logo)
    const pics=images.filter(x=>x!==logo&&x.solid>=0.6&&x.w>=300&&x.h>=200&&x.w/x.h<=4.2&&!(logo&&x.url===logo.url)).sort((a,b)=>b.area-a.area);
    D.f.fuente={archivo:file.name,paginas:fuentes,imagenes:images.map(({pagina,w,h,solid})=>({pagina,ancho:w,alto:h,solidez:+solid.toFixed(2)})),datos:specs.map(([l,v])=>({texto:l+': '+v})),fecha:new Date().toISOString()};
    D.alertas=[];
    if(pics.length){D.f.foto=await dzV2StoreImportedImage(pics[0].url,'foto-importada.png');if(!D.f.foto?.id)D.alertas.push('Foto temporal: subir archivo persistente antes de guardar.')}else D.alertas.push('El datasheet no trae una foto del equipo con fondo recortado.');
    D.f.logo=null;if(logo){logo.url=await darkLogo(logo.url);D.f.logo=await dzV2StoreImportedImage(logo.url,'logo-importado.png');if(!D.f.logo?.id)D.alertas.push('Logo temporal: subir archivo persistente antes de guardar.')}
    const base=pById(D.pid);
    const parsed={...(base||{}),nombre:base?.nombre||modelo||file.name.replace(/\.pdf$/i,''),marca:base?.marca||(/fiberhome/i.test(all)?'FiberHome':''),familia:base?.familia||fam,capa:base?.capa||'',estado:'parcial',specs:[...(base?.specs||[]),...specs.filter(s=>!(base?.specs||[]).some(b=>norm(b[0])===norm(s[0])))]};
    if(!specs.length)D.alertas.push('No se identificaron especificaciones en el datasheet. Revisar manualmente.');
    const out=dzV2Build(parsed,'');dzVolcar(out);
    D.faltan=out.faltan;D.alertas=[...D.alertas,...out.alertas,'Verificar modelo y especificaciones extraídos antes de publicar.'];D.crit=out.criterio;
    toast('Datasheet: '+pdf.numPages+' páginas · '+specs.length+' especificaciones · '+images.length+' imágenes');
  }catch(e){D.err='No se pudo importar el datasheet: '+e.message}finally{D.busy=false;render()}
};
})();
